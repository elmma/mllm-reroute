# @package _global_
# LLaVA-1.5-7B + Ours-vs-PDrop reroute (pyramid-keep schedule) @ avg_T = 128.
defaults:
  - /eval: pope
  - /model: llava15_7b_hf
  - _self_

routing:
  method: pdrop
  action: compact_route
  monotonic: false
  drop_layers: [2, 7, 15, 23]
  keep_ratios: [0.2655, 0.2655, 0.1328, 0.0664]

eval:
  batch_size: 1
  log_samples: true
