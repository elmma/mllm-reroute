# @package _global_
# Qwen2.5-VL-7B + PDrop early-L2 vanilla @ avg_T = 64.
defaults:
  - /eval: pope
  - /model: qwen25vl_7b
  - _self_

routing:
  method: pdrop
  action: physical_delete
  monotonic: true
  drop_layers: [2, 6, 13, 20]
  keep_ratios: [0.2789, 0.0937, 0.0315, 0.0106]

eval:
  batch_size: 1
  log_samples: true
