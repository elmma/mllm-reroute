# @package _global_
# LLaVA-1.5-7B + Ours-vs-FastV reroute (uniform-keep schedule) @ avg_T = 64.
defaults:
  - /eval: pope
  - /model: llava15_7b_hf
  - _self_

routing:
  method: pdrop
  action: compact_route
  monotonic: false
  drop_layers: [3, 7, 15, 23]
  keep_ratios: [0.01916, 0.01916, 0.01916, 0.01916]

eval:
  batch_size: 1
  log_samples: true
