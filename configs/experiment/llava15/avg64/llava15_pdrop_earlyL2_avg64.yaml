# @package _global_
# LLaVA-1.5-7B + PDrop early-L2 vanilla physical_delete @ avg_T = 64.
defaults:
  - /eval: pope
  - /model: llava15_7b_hf
  - _self_

routing:
  method: pdrop
  action: physical_delete
  monotonic: true
  drop_layers: [2, 7, 15, 23]
  keep_ratios: [0.2789, 0.0937, 0.0315, 0.0106]

eval:
  batch_size: 1
  log_samples: true
