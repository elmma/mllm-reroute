# @package _global_
# Qwen2.5-VL-7B + Ours-vs-PDrop reroute, stagewise compact dispatch @ avg_T = 128.
defaults:
  - /eval: pope
  - /model: qwen25vl_7b
  - _self_

routing:
  method: pdrop
  action: compact_route_stagewise
  monotonic: false
  drop_layers: [2, 6, 13, 20]
  keep_ratios: [0.2655, 0.2655, 0.1328, 0.0664]

eval:
  batch_size: 1
  log_samples: true
