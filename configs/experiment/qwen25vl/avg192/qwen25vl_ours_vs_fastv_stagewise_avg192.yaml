# @package _global_
# Qwen2.5-VL-7B + Ours-vs-FastV reroute (stagewise compact dispatch).
# Same routing as qwen25vl_llava15_ours_vs_fastv_avg192; stays compact across
# in-stage non-routing layers (memory bandwidth saving).
defaults:
  - /eval: pope
  - /model: qwen25vl_7b
  - _self_

routing:
  method: pdrop
  action: compact_route_stagewise
  monotonic: false
  drop_layers: [3, 6, 13, 20]
  keep_ratios: [0.2644, 0.2644, 0.2644, 0.2644]

eval:
  batch_size: 1
  log_samples: true
