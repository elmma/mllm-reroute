# @package _global_
# Qwen2.5-VL-7B + Ours-vs-PDrop reroute (Ours-vs-PDrop head-to-head).
# Schedule keep_ratios FROZEN to LLaVA reference; drop_layers normalized
# for Qwen 28-layer LLM: LLaVA [2,7,15,23] → Qwen [2,6,13,20].
defaults:
  - /eval: pope
  - /model: qwen25vl_7b
  - _self_

routing:
  method: pdrop
  action: compact_route
  monotonic: false
  drop_layers: [2, 6, 13, 20]
  keep_ratios: [0.4502, 0.4502, 0.2251, 0.1126]

eval:
  batch_size: 1
  log_samples: true
