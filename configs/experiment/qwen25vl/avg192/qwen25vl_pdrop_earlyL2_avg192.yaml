# @package _global_
# Qwen2.5-VL-7B + PDrop early-L2 vanilla @ avg_T = 192.
# Schedule shape FROZEN to LLaVA reference; drop_layers normalized for
# Qwen's 28-layer LLM: LLaVA [2,7,15,23] (L32) → Qwen [2,6,13,20] (L28).
defaults:
  - /eval: pope
  - /model: qwen25vl_7b
  - _self_

routing:
  method: pdrop
  action: physical_delete
  monotonic: true
  drop_layers: [2, 6, 13, 20]
  keep_ratios: [0.5965, 0.3558, 0.2123, 0.1266]

eval:
  batch_size: 1
  log_samples: true
