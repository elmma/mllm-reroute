# @package _global_
# Qwen2.5-VL-7B + PDrop early-L2 vanilla @ avg_T = 128.
# Schedule keep_ratios FROZEN to LLaVA reference; drop_layers normalized:
# LLaVA [2,7,15,23] (L32) → Qwen [2,6,13,20] (L28).
defaults:
  - /eval: pope
  - /model: qwen25vl_7b
  - _self_

routing:
  method: pdrop
  action: physical_delete
  monotonic: true
  drop_layers: [2, 6, 13, 20]
  keep_ratios: [0.4570, 0.2088, 0.0954, 0.0436]

eval:
  batch_size: 1
  log_samples: true
